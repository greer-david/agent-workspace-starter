# Merge into $CODEX_HOME/config.toml (default ~/.codex/config.toml); don't replace it.
# Power BI plugins are NOT here: install them from the work repo's pin with
# `codex plugin marketplace add ... --ref <pin>` and `codex plugin add ...`.
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
approvals_reviewer = "auto_review"

[tui]
status_line = ["model-with-reasoning", "context-used", "used-tokens", "context-window-size", "task-progress", "git-branch", "branch-changes"]
terminal_title = ["spinner", "project", "git-branch"]
status_line_use_colors = true

[marketplaces.caveman]
source_type = "git"
source = "https://github.com/JuliusBrussee/caveman.git"

[plugins."caveman@caveman"]
enabled = true
